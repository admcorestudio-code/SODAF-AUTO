name: verif-site
on:
  push:
    paths: [".github/workflows/verif-site.yml"]  # essai 2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            echo "== NS"; dig +short NS autosodaf.com
            echo "== A / www"; dig +short A autosodaf.com; dig +short www.autosodaf.com
            echo "== reverse"; dig +short -x 198.54.117.242
            echo "== SOA"; dig +short SOA autosodaf.com
            echo "== whois"; sudo apt-get install -y -qq whois >/dev/null 2>&1; whois autosodaf.com | grep -iE "registrar:|expir|updated date|creation date|domain status|name server|registrar url" | head -25
            echo "== http"; curl -sS -m 15 -o /dev/null -w "http code=%{http_code} redirect=%{redirect_url}\n" http://autosodaf.com/ || echo ECHEC
            curl -sS -m 15 http://autosodaf.com/ | head -c 400; echo
            echo "== github pages direct"; curl -sS -m 15 -o /dev/null -w "code=%{http_code} redirect=%{redirect_url}\n" https://admcorestudio-code.github.io/sodaf-auto/
          } > .github/verif-resultat.txt 2>&1
          git config user.name verif-bot; git config user.email verif@users.noreply.github.com
          git add .github/verif-resultat.txt; git commit -m "Résultat de la vérification du site [skip ci]" && git push
